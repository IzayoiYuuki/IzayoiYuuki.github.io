  <main class="wrap">

        <p class="lede"><span class="lede-title" lang="zh-Hans">我的年度游戏</span></p>

        <header class="year-banner">
          <div>
            <p class="eyebrow">The annual selection</p>
            <h2 id="year-heading"><em>Game of</em> <span id="selected-year">2026</span></h2>
            <p class="year-caption" id="year-caption" lang="zh-Hans">2026年度游戏</p>
          </div>
          <span class="banner-year" id="banner-year" aria-hidden="true">2026</span>
        </header>

        <div class="pick-layout">
          <figure class="game-art">
            <div class="cover-frame" id="cover-frame">
              <img src="covers/2026-fire-emblem-key-art-ja.webp" alt="Japanese key artwork of ファイアーエムブレム 万紫千紅, featuring the main characters and original title.">
              <div class="cover-placeholder" id="cover-placeholder" hidden>
                <span class="cover-year" id="cover-year" aria-hidden="true">2026</span>
                <svg class="cover-icon" viewBox="0 0 64 48" fill="none" aria-hidden="true">
                  <path d="M21 11h22c7 0 11 6 13 16l2 9c1 6-5 9-9 5l-8-7H23l-8 7c-4 4-10 1-9-5l2-9c2-10 6-16 13-16Z" stroke="currentColor" stroke-width="2"/>

                  <circle cx="43" cy="21" r="2" fill="currentColor"/><circle cx="49" cy="27" r="2" fill="currentColor"/>
                </svg>
                <span class="cover-label" id="cover-label">Cover coming soon</span>
                <span class="cover-subtitle">Game of the year</span>
              </div>
            </div>
            <figcaption><span id="cover-caption">My 2026 selection · 火焰之纹章：万紫千红</span><a id="cover-source" href="https://www.nintendo.com/jp/games/switch2/aacsa/index.html">Cover source</a></figcaption>
          </figure>

          <div class="game-notes">
            <div class="pick-heading">
              <p class="eyebrow">Game of the year</p>
              <h3 id="game-title" lang="zh-Hans">火焰之纹章：万紫千红</h3>
              <p class="pick-summary" id="game-summary"></p>
            </div>
            <div class="review-section"><p id="note-why"></p></div>
            <div class="review-section"><p id="note-moments"></p></div>
            <div class="review-section"><p id="note-reflections"></p></div>
          </div>

    <p class="sr-only" id="selection-status" role="status" aria-live="polite"></p>
